name: Validate Codex Cloud plugin

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/kerr_qnm_toolkit.py --help
      - run: python scripts/kerr_qnm_toolkit.py inspect-workspace --workspace-root "$GITHUB_WORKSPACE"

  numerical-canary:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare verified Julia/Python toolchain
        run: python scripts/kerr_qnm_toolkit.py prepare-toolchain --runtime-root "$RUNNER_TEMP/kerr-qnm-runtime"
      - name: Run short Julia, NumPy/SciPy, and transfer canary
        run: python scripts/kerr_qnm_toolkit.py numerical-canary --mode all --runtime-root "$RUNNER_TEMP/kerr-qnm-runtime"
